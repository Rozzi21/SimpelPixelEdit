<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="field-container">
    <div class="color-palette">
        <div class="color-cell red selected"></div>
        <div class="color-cell green"></div>
        <div class="color-cell blue"></div>
        <div class="color-cell yellow"></div>
        <div class="color-cell skyblue"></div>
        <div class="tool-cell eraser">
            <img src="eraser_white.png" alt="">
        </div>
        <div class="tool-cell fill-tool">
            <img src="bucket_white.png" alt="">
        </div>
		<div class="tool-cell save-tool">
            <img src="save_white.png" alt="">
        </div>
    </div>
    <div class="field"></div>
</div>
<!-- dom-to-image library: required by the save tool in script.js -->
<script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>
<script src="script.js"></script>
</body>
</html>
